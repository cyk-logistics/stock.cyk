name: Monthly Signal Report

# สรุปผลหุ้นที่เมลแนะนำประจำเดือน → เมลวันทำการสุดท้ายของเดือน (สคริปต์เช็ควันเอง)
# รันวันที่ 28-31 + 1-3 ทุกเดือน: cron ของ GitHub ดีเลย์ได้หลายชั่วโมง ถ้าหลุดข้ามเดือน
# สคริปต์จะสรุปเดือนก่อนให้ในวันที่ 1-3 (ถ้ายังไม่ได้ส่ง — ดูจาก history/report_YYYY-MM.json)
# ⚠️ อย่าใส่ทั้งวันที่และวันในสัปดาห์ใน cron พร้อมกัน — cron จะรัน "อย่างใดอย่างหนึ่ง" (OR)
on:
  schedule:
    - cron: '0 11 28-31,1-3 * *'    # ~18:00 ICT (หลังเมลรายวัน 17:00) — เวลาเป็น UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'เดือนที่จะสรุป YYYY-MM (ว่าง = ตัดสินจากวันนี้)'
        required: false
        default: ''
      force:
        description: 'ส่งเลยแม้ไม่ใช่สิ้นเดือน/เคยส่งแล้ว'
        type: boolean
        default: false

permissions:
  contents: write              # commit history/report_YYYY-MM.json กันส่งซ้ำ

concurrency:
  group: signal-monthly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ติดตั้ง yfinance (ราคาสำรองถ้า live.atlog.asia ล่ม)
        run: pip install -q yfinance
      - name: สรุปผลหุ้นที่แนะนำ + ส่งเมล
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: info@atls.co.th
          MAIL_FROM: "SET Buy Signals <no-reply@lifebazi.com>"
          SCAN_API_BASE: https://live.atlog.asia
          IN_MONTH: ${{ github.event.inputs.month }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$IN_MONTH" ]; then ARGS="$ARGS --month $IN_MONTH"; fi
          if [ "$IN_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python signal_monthly_report.py $ARGS
      - name: บันทึกรายงาน (commit กลับ — [skip ci] กันไป trigger screener/LINE)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/report_*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Monthly signal report [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort || true
            git push || echo "⚠ push รายงานไม่ผ่าน"
          fi
        continue-on-error: true
