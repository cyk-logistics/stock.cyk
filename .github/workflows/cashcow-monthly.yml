name: Cash Cow Screen (monthly)

# คัดกลุ่ม Cash Cow ใหม่จากงบล่าสุด (เกณฑ์ลงทุนแมน) → cashcow.json ที่ระบบ 2 + หน้าเว็บใช้
# รันวันที่ 1-3 ของเดือน (งบออกรายไตรมาส — เดือนละครั้งพอ) · ไฟล์ไม่เปลี่ยน = ไม่ commit
on:
  schedule:
    - cron: '0 0 1-3 * *'      # ~07:00 ICT — เวลาเป็น UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cashcow-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ติดตั้ง yfinance
        run: pip install -q yfinance pandas
      - name: คัดหุ้น Cash Cow จากงบปีล่าสุด
        run: python cashcow_screen.py
      - name: บันทึกผล (commit กลับ — [skip ci])
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, sys
          d = json.load(open("cashcow.json"))
          # กันข้อมูล Yahoo ล่มแล้วเขียนทับด้วยรายการว่าง
          sys.exit(0 if len(d.get("rows", [])) >= 40 else 1)
          PY
          git add cashcow.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cash Cow screen [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort || true
            git push || echo "⚠ push ไม่ผ่าน"
          fi
