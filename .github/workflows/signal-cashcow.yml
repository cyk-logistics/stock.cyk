name: Cash Cow System Email (ระบบ 2)

# ระบบ 2 🐄 Cash Cow — แยกจากระบบ 1 · ส่งเมลเฉพาะวันที่มีสัญญาณใหม่หรือมีตัวควรออก
on:
  schedule:
    - cron: '15 10 * * 1-5'    # ~17:15 ICT วันธรรมดา (หลังตลาดปิด) — เวลาเป็น UTC
  workflow_dispatch:
    inputs:
      send_empty:
        description: 'ส่งเมลสรุปสถานะแม้ไม่มีสัญญาณใหม่'
        type: boolean
        default: false

permissions:
  contents: write              # commit ประวัติระบบ 2 (history/signals_cc.jsonl, exits_cc.jsonl)

concurrency:
  group: signal-cashcow
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: สแกนหุ้น Cash Cow ที่อยู่ในจังหวะซื้อ + ส่งเมล
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: atlogistics@ymail.com
          MAIL_FROM: "SET Buy Signals <no-reply@lifebazi.com>"
          SCAN_API_BASE: https://live.atlog.asia
          SEND_EMPTY: ${{ github.event.inputs.send_empty == 'true' && '1' || '' }}
        run: python signal_cashcow.py
      - name: บันทึกประวัติระบบ 2 (commit กลับ — [skip ci] กันไป trigger screener/LINE)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in history/signals_cc.jsonl history/exits_cc.jsonl; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Log Cash Cow system history [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort || true
            git push || echo "⚠ push ประวัติไม่ผ่าน — รอบหน้าลองใหม่"
          fi
        continue-on-error: true
