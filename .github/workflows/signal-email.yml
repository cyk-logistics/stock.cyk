name: Daily Buy-Signal Email

on:
  schedule:
    - cron: '0 10 * * 1-5'    # ~17:00 ICT วันธรรมดา (หลังตลาด SET ปิด) — เวลาเป็น UTC
  workflow_dispatch:

permissions:
  contents: write              # commit ประวัติหุ้นที่แนะนำกลับ repo (history/signals_1d.jsonl)

concurrency:
  group: signal-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: สแกนสัญญาณซื้อ (ย่อในขาขึ้น) + ส่งเมล
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: info@atls.co.th
          MAIL_FROM: "SET Buy Signals <no-reply@lifebazi.com>"
          SCAN_API_BASE: https://live.atlog.asia
        run: python signal_email.py
      - name: บันทึกประวัติหุ้นที่แนะนำ (commit กลับ — [skip ci] กันไป trigger screener/LINE)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f history/signals_1d.jsonl ]; then git add history/signals_1d.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "Log daily signal email history [skip ci]"
            git pull --rebase --autostash origin main || git rebase --abort || true
            git push || echo "⚠ push ประวัติไม่ผ่าน — รอบหน้าลองใหม่"
          fi
        continue-on-error: true
